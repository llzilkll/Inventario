<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cambiar contraseña — Inventario San Martín</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 34px 30px; width: 100%; max-width: 380px; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #94a3b8; margin-bottom: 22px; }
  label { display: block; font-size: 12px; color: #cbd5e1; margin: 14px 0 5px; font-weight: 600; }
  input { width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #e2e8f0; font-size: 15px; }
  input:focus { outline: none; border-color: #22c55e; }
  button { width: 100%; margin-top: 22px; padding: 12px; border: none; border-radius: 8px; background: #22c55e; color: #052e16; font-size: 15px; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .msg { display: none; margin-top: 16px; padding: 10px 12px; border-radius: 8px; font-size: 13px; }
  .msg.err { display: block; background: rgba(239,68,68,.12); border: 1px solid #ef4444; color: #fca5a5; }
  .hint { font-size: 12px; color: #94a3b8; margin-top: 6px; }
</style>
</head>
<body>
  <form class="card" id="form" autocomplete="off">
    <h1>Cambiá tu contraseña</h1>
    <div class="sub">Es tu primer ingreso. Definí una contraseña personal para continuar.</div>

    <label for="p1">Nueva contraseña</label>
    <input id="p1" type="password" minlength="6" required>
    <div class="hint">Mínimo 6 caracteres.</div>

    <label for="p2">Repetir contraseña</label>
    <input id="p2" type="password" minlength="6" required>

    <button id="btn" type="submit">Guardar y continuar</button>
    <div class="msg" id="msg"></div>
  </form>

  <script type="module">
    import { auth, db } from './src/firebase-init.js';
    import { protegerPagina, logout } from './src/auth.js';
    import { updatePassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { doc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Permitir el acceso aunque el cambio esté pendiente (esta ES la pantalla de cambio).
    await protegerPagina({ permitirCambioPass: true });

    const form = document.getElementById('form');
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');
    const error = (t) => { msg.textContent = t; msg.className = 'msg err'; };

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'msg';
      const p1 = document.getElementById('p1').value;
      const p2 = document.getElementById('p2').value;
      if (p1.length < 6) return error('La contraseña debe tener al menos 6 caracteres.');
      if (p1 !== p2) return error('Las contraseñas no coinciden.');
      btn.disabled = true; btn.textContent = 'Guardando…';
      try {
        await updatePassword(auth.currentUser, p1);
        await updateDoc(doc(db, 'users', auth.currentUser.uid), { debeCambiarPass: false });
        location.replace('index.html');
      } catch (err) {
        if ((err?.code || '').includes('requires-recent-login')) {
          error('Por seguridad, volvé a iniciar sesión y cambiala de nuevo.');
          setTimeout(async () => { await logout(); location.replace('login.html'); }, 2500);
        } else {
          error('No se pudo cambiar la contraseña. Intentá de nuevo.');
          btn.disabled = false; btn.textContent = 'Guardar y continuar';
        }
      }
    });
  </script>
</body>
</html>
