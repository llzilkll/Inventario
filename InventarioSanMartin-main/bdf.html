<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Productos - Inventario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .hidden { display: none; }
        /* Spinner */
        @keyframes spin { to { transform: rotate(360deg); } }
        .animate-spin { animation: spin 1s linear infinite; }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { 'primary': '#4f46e5', 'primary-light': '#6366f1' } } }
        }
    </script>
</head>
<body class="p-4 md:p-6 min-h-screen transition-colors duration-300 dark:bg-slate-900">

    <div id="app-container" class="max-w-7xl mx-auto">
        
        <!-- HEADER -->
        <header class="sticky top-0 z-40 bg-[#f8fafc]/95 dark:bg-slate-900/95 backdrop-blur-sm flex flex-col md:flex-row md:items-center justify-between mb-8 pb-6 border-b border-gray-200 dark:border-slate-700 transition-all duration-300">
            <div>
                <div class="inline-flex items-center gap-2 mb-2">
                    <div class="px-2.5 py-0.5 rounded-full bg-pink-100 border border-pink-200">
                        <p class="text-[10px] font-bold tracking-widest text-pink-700 uppercase">Módulo de Fotos</p>
                    </div>
                </div>
                <h1 class="text-3xl font-extrabold text-slate-800 dark:text-white tracking-tight">
                    Galería de <span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-600 to-rose-500">Productos</span>
                </h1>
                <p class="text-sm text-slate-500 mt-1">Subida y visualización de imágenes de inventario.</p>
            </div>
            
            <div class="mt-4 md:mt-0 flex flex-col md:flex-row w-full md:w-auto space-y-2 md:space-y-0 md:space-x-2">
                <button onclick="toggleSelectAll()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2 px-4 rounded-xl transition shadow-sm flex justify-center items-center gap-2">
                    <span>✅</span> Seleccionar Todo
                </button>
                <button onclick="downloadSelected()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-xl transition shadow-sm flex justify-center items-center gap-2">
                    <span>📦</span> Descargar Seleccionados (.ZIP)
                </button>
                <button onclick="toggleDarkMode()" class="p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-yellow-400 hover:bg-slate-50 dark:hover:bg-slate-700 transition shadow-sm flex justify-center">
                    <span class="dark:hidden">🌙</span><span class="hidden dark:inline">☀️</span>
                </button>
                <a href="index.html" class="bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 font-bold py-2 px-4 rounded-xl transition shadow-sm flex justify-center items-center gap-2">
                    <span>⬅️</span> Volver al Inventario
                </a>
            </div>
        </header>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="space-y-8">
            
            <!-- SECCIÓN DE SUBIDA -->
            <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700">
                <h2 class="text-xl font-bold text-gray-800 dark:text-white mb-4 flex items-center gap-2">
                    <span>📸</span> Subir Nueva Foto
                </h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Selección de Producto -->
                    <div class="relative">
                        <label for="product-search" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">1. Buscar Producto</label>
                        <input type="text" id="product-search" oninput="searchProducts()" placeholder="Escriba para buscar..." class="w-full p-3 border border-gray-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-xl outline-none focus:ring-2 focus:ring-pink-500" autocomplete="off">
                        <div id="search-results" class="absolute left-0 right-0 mt-1 bg-white dark:bg-slate-700 border border-gray-200 dark:border-slate-600 rounded-xl shadow-xl z-50 max-h-60 overflow-y-auto hidden"></div>
                        <p class="text-xs text-gray-500 mt-1">Busque en el inventario activo.</p>
                    </div>

                    <!-- Selección de Archivo -->
                    <div>
                        <label for="file-input" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">2. Elegir Imagen</label>
                        <input type="file" id="file-input" accept="image/*" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-pink-50 file:text-pink-700 hover:file:bg-pink-100 dark:file:bg-pink-900 dark:file:text-pink-300"/>
                    </div>
                </div>

                <!-- Barra de Progreso -->
                <div id="progress-container" class="hidden mt-6">
                    <div class="flex justify-between mb-1">
                        <span class="text-sm font-medium text-pink-700 dark:text-pink-400">Subiendo...</span>
                        <span class="text-sm font-medium text-pink-700 dark:text-pink-400" id="progress-text">0%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2.5 dark:bg-gray-700">
                        <div class="bg-pink-600 h-2.5 rounded-full transition-all duration-300" id="progress-bar" style="width: 0%"></div>
                    </div>
                </div>

                <!-- Botón Subir -->
                <div class="mt-6 flex justify-end">
                    <button onclick="uploadPhoto()" id="upload-btn" class="bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                        <span>☁️</span> Subir Foto
                    </button>
                </div>
            </div>

            <!-- GALERÍA -->
            <div>
                <h2 class="text-xl font-bold text-gray-800 dark:text-white mb-4 flex items-center gap-2">
                    <span>🖼️</span> Galería de Imágenes
                </h2>
                <div id="gallery-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                    <p class="col-span-full text-center text-gray-400 py-10 italic">Cargando galería...</p>
                </div>
            </div>

        </main>
    </div>

    <!-- MODAL DE DETALLE DE IMAGEN -->
    <div id="image-modal" class="fixed inset-0 z-50 hidden bg-black/90 backdrop-blur-sm flex items-center justify-center p-4" onclick="closeImageModal()">
        <div class="relative max-w-5xl w-full bg-white dark:bg-slate-800 rounded-2xl shadow-2xl overflow-hidden flex flex-col md:flex-row max-h-[90vh]" onclick="event.stopPropagation()">
            <button onclick="closeImageModal()" class="absolute top-4 right-4 z-10 bg-black/50 hover:bg-black/70 text-white rounded-full p-2 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
            
            <div class="w-full md:w-2/3 bg-black flex items-center justify-center">
                <img id="modal-img" src="" class="max-h-[50vh] md:max-h-[90vh] w-full object-contain" alt="Product Image">
            </div>
            
            <div class="w-full md:w-1/3 p-6 flex flex-col overflow-y-auto border-l border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-800">
                <div class="mb-6">
                    <p class="text-xs font-bold text-pink-600 uppercase tracking-widest mb-1">Catálogo</p>
                    <h3 id="modal-catalog" class="text-2xl font-extrabold text-gray-900 dark:text-white leading-tight break-words"></h3>
                </div>
                
                <div class="space-y-4 flex-1">
                    <div class="p-4 bg-gray-50 dark:bg-slate-700/50 rounded-xl border border-gray-100 dark:border-slate-700">
                        <p class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1">Descripción Completa</p>
                        <p id="modal-desc" class="text-sm font-medium text-gray-800 dark:text-gray-200 break-words"></p>
                    </div>
                    
                    <div class="p-4 bg-gray-50 dark:bg-slate-700/50 rounded-xl border border-gray-100 dark:border-slate-700">
                        <p class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1">Número de Parte</p>
                        <p id="modal-part" class="text-sm font-mono font-bold text-indigo-600 dark:text-indigo-400 break-all"></p>
                    </div>
                </div>

                <div class="mt-8 pt-6 border-t border-gray-100 dark:border-slate-700">
                     <a id="modal-download" href="#" class="w-full block text-center bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl transition shadow-lg flex justify-center items-center gap-2">
                        <span>⬇️</span> Descargar Imagen
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="maestro-cache.js"></script>
    <script type="module">
        // Importaciones Modulares (Compatibles con index.html)
        import { db, rtdb, storage, appId } from './src/firebase-init.js';
        import { protegerPagina, obtenerSesion, logout } from './src/auth.js';
        import { collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { ref, onValue, remove, set } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";
        import { ref as sRef, uploadBytesResumable, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        // Variables Globales
        let userId = null;
        let esAdmin = false;
        let productsList = [];
        let maestroData = [];

        // --- INICIALIZACIÓN ---
        async function initGaleria() {
            await loadProducts(); // Esperar a cargar productos para tener los detalles
            await loadMaestroData(); // Cargar catálogo para descripciones
            loadGallery();  // Cargar galería existente
        }

        // --- 1. CARGAR PRODUCTOS (Desde Firestore para llenar el Select) ---
        async function loadProducts() {
            try {
                // Usamos la misma referencia que index.html para leer el inventario real
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'activos');
                const snapshot = await getDocs(colRef);
                
                productsList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                console.log("Productos cargados para búsqueda:", productsList.length);
            } catch (e) {
                console.error("Error cargando productos:", e);
            }
        }

        // --- CARGAR MAESTRO (Catálogo) ---
        async function loadMaestroData() {
            try {
                const url = window.resolveMaestroUrl('maestro.json');
                maestroData = await window.fetchWithCache(url, 'maestro_data');
            } catch (e) {
                console.error("Error loading maestro:", e);
            }
        }

        // --- BÚSQUEDA AUTOCOMPLETADO ---
        window.searchProducts = function() {
            const input = document.getElementById('product-search');
            const resultsContainer = document.getElementById('search-results');
            const query = input.value.toLowerCase();

            resultsContainer.innerHTML = '';
            if (query.length < 2) {
                resultsContainer.classList.add('hidden');
                return;
            }

            // Filtrar productos (Nombre, Parte o Serie)
            const results = productsList.filter(p => 
                (p.name || '').toLowerCase().includes(query) || 
                (p.numParte || '').toLowerCase().includes(query) ||
                (p.numSerie || '').toLowerCase().includes(query)
            ).slice(0, 10); // Limitar a 10 resultados

            if (results.length > 0) {
                results.forEach(p => {
                    const div = document.createElement('div');
                    div.className = "p-3 border-b border-gray-100 dark:border-slate-600 hover:bg-pink-50 dark:hover:bg-slate-600 cursor-pointer transition";
                    div.innerHTML = `
                        <p class="font-bold text-gray-800 dark:text-white text-sm">${p.name}</p>
                        <p class="text-xs text-gray-500 dark:text-gray-400">${p.numParte || 'S/P'} | ${p.ubicacion || 'N/A'}</p>
                    `;
                    div.onclick = () => {
                        input.value = p.name;
                        resultsContainer.classList.add('hidden');
                    };
                    resultsContainer.appendChild(div);
                });
                resultsContainer.classList.remove('hidden');
            } else {
                resultsContainer.innerHTML = '<div class="p-3 text-sm text-gray-500 italic">No se encontraron resultados.</div>';
                resultsContainer.classList.remove('hidden');
            }
        }

        // --- RENOMBRADO AUTOMÁTICO ---
        function sanitizeFilename(name) {
            return name.normalize("NFD").replace(/[\u0300-\u036f]/g, "") // Quitar acentos
                       .replace(/\s+/g, '_') // Espacios a guiones bajos
                       .replace(/[^a-zA-Z0-9_]/g, '') // Quitar caracteres especiales
                       .toLowerCase();
        }

        // --- 2. COMPRESIÓN DE IMAGEN (Canvas) ---
        function compressImage(file, maxWidth = 1280, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;

                        // Calcular nuevas dimensiones manteniendo aspecto
                        if (width > maxWidth || height > maxWidth) {
                            if (width > height) {
                                height *= maxWidth / width;
                                width = maxWidth;
                            } else {
                                width *= maxWidth / height;
                                height = maxWidth;
                            }
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            if (blob) resolve(blob);
                            else reject(new Error("Error al comprimir imagen"));
                        }, 'image/jpeg', quality);
                    };
                    img.onerror = (e) => reject(e);
                };
                reader.onerror = (e) => reject(e);
            });
        }

        // --- 3. SUBIR FOTO ---
        window.uploadPhoto = async function() {
            const productName = document.getElementById('product-search').value.trim();
            const fileInput = document.getElementById('file-input');
            const file = fileInput.files[0];

            if (!productName) return Swal.fire('Atención', 'Busque y seleccione un producto.', 'warning');
            if (!file) return Swal.fire('Atención', 'Seleccione una imagen.', 'warning');

            const btn = document.getElementById('upload-btn');
            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');

            btn.disabled = true;
            progressContainer.classList.remove('hidden');

            try {
                // 1. Comprimir
                const compressedBlob = await compressImage(file);
                
                // 2. Subir a Storage
                const sanitizedProduct = sanitizeFilename(productName);
                // Nombre estricto por catálogo para sobrescritura
                const filename = `${sanitizedProduct}.jpg`;
                const storageRef = sRef(storage, `fotos_inventario/${filename}`);
                const uploadTask = uploadBytesResumable(storageRef, compressedBlob);

                uploadTask.on('state_changed', 
                    (snapshot) => {
                        const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                        progressBar.style.width = progress + '%';
                        progressText.textContent = Math.round(progress) + '%';
                    }, 
                    (error) => {
                        console.error(error);
                        Swal.fire('Error', 'Fallo al subir la imagen.', 'error');
                        btn.disabled = false;
                        progressContainer.classList.add('hidden');
                    }, 
                    async () => {
                        // 3. Obtener URL y Guardar en RTDB
                        const downloadURL = await getDownloadURL(uploadTask.snapshot.ref);
                        
                        // Usar el nombre sanitizado como clave para facilitar búsqueda y sobrescritura
                        const galleryRef = ref(rtdb, `galeria/${sanitizedProduct}`);
                        await set(galleryRef, {
                            producto: productName,
                            url: downloadURL,
                            storagePath: `fotos_inventario/${filename}`,
                            fecha: new Date().toLocaleDateString(),
                            timestamp: Date.now(),
                            usuario: localStorage.getItem('operario_gram') || 'DESCONOCIDO'
                        });

                        Swal.fire({
                            icon: 'success',
                            title: '¡Foto Subida!',
                            toast: true,
                            position: 'top-end',
                            showConfirmButton: false,
                            timer: 3000
                        });

                        // Reset UI
                        fileInput.value = '';
                        btn.disabled = false;
                        progressContainer.classList.add('hidden');
                        progressBar.style.width = '0%';
                    }
                );

            } catch (e) {
                console.error(e);
                Swal.fire('Error', 'Ocurrió un error inesperado.', 'error');
                btn.disabled = false;
                progressContainer.classList.add('hidden');
            }
        }

        // --- 4. CARGAR GALERÍA (Desde RTDB) ---
        function loadGallery() {
            const galleryRef = ref(rtdb, 'galeria');
            onValue(galleryRef, (snapshot) => {
                const container = document.getElementById('gallery-grid');
                container.innerHTML = '';
                
                const data = snapshot.val();
                if (!data) {
                    container.innerHTML = '<p class="col-span-full text-center text-gray-400 py-10">No hay fotos en la galería.</p>';
                    return;
                }

                const items = Object.entries(data).map(([key, val]) => ({ key, ...val }));
                // Ordenar: Más nuevas primero
                items.sort((a, b) => b.timestamp - a.timestamp);

                items.forEach(item => {
                    // Buscar detalles adicionales en la lista de productos cargada
                    const productDetails = productsList.find(p => p.name === item.producto) || {};
                    
                    // Buscar descripción en maestro si no está en productDetails
                    let description = productDetails.descripcion;
                    if (!description && maestroData.length > 0) {
                        const maestroItem = maestroData.find(m => m.catalogo == item.producto);
                        if (maestroItem) description = maestroItem.descripcion;
                    }

                    // Preparar datos para el modal
                    const desc = description || 'Sin descripción disponible';
                    const parte = productDetails.numParte || 'S/N';
                    const catalogo = item.producto;
                    
                    // Escapar comillas simples para el string del onclick
                    const safeDesc = desc.replace(/'/g, "\\'").replace(/"/g, "&quot;");
                    const safeParte = parte.replace(/'/g, "\\'").replace(/"/g, "&quot;");
                    const safeCatalogo = catalogo.replace(/'/g, "\\'").replace(/"/g, "&quot;");

                    const div = document.createElement('div');
                    div.className = "bg-white dark:bg-slate-700 rounded-xl shadow-sm border border-gray-100 dark:border-slate-600 overflow-hidden group hover:shadow-md transition";
                    div.innerHTML = `
                        <div class="relative aspect-square overflow-hidden bg-gray-100 cursor-pointer" onclick="openDetailedModal('${item.url}', '${safeDesc}', '${safeParte}', '${safeCatalogo}')">
                            <img src="${item.url}" class="w-full h-full object-cover transition duration-500 group-hover:scale-105" loading="lazy">
                            <div class="absolute inset-0 bg-black/0 group-hover:bg-black/20 transition duration-300 flex items-center justify-center opacity-0 group-hover:opacity-100">
                                <span class="text-white font-bold text-lg drop-shadow-md">Ver Detalle 👁️</span>
                            </div>
                            <input type="checkbox" onclick="event.stopPropagation()" class="photo-checkbox absolute top-3 right-3 w-5 h-5 rounded border-gray-300 text-pink-600 focus:ring-pink-500 cursor-pointer z-20 shadow-sm" value="${item.url}" data-filename="${item.storagePath.split('/').pop()}">
                        </div>
                        <div class="p-4">
                            <h3 class="font-bold text-gray-800 dark:text-white truncate" title="${item.producto}">${item.producto}</h3>
                            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">${item.fecha} • ${item.usuario || 'Anon'}</p>
                            
                            <div class="flex justify-between items-center mt-4 pt-3 border-t border-gray-100 dark:border-slate-600">
                                <a href="${item.url}" target="_blank" rel="noopener noreferrer" download class="text-indigo-600 hover:text-indigo-800 text-sm font-bold flex items-center gap-1" onclick="event.stopPropagation()">
                                    <span>⬇️</span> Descargar
                                </a>
                                <button onclick="deletePhoto('${item.key}', '${item.storagePath}'); event.stopPropagation()" class="text-red-400 hover:text-red-600 p-1 rounded hover:bg-red-50 transition" title="Borrar Foto">
                                    🗑️
                                </button>
                            </div>
                        </div>
                    `;
                    container.appendChild(div);
                });
            });
        }

        // --- FUNCIONES DEL MODAL ---
        window.openDetailedModal = function(url, desc, parte, catalogo) {
            document.getElementById('modal-img').src = url;
            document.getElementById('modal-desc').textContent = desc;
            document.getElementById('modal-part').textContent = parte;
            document.getElementById('modal-catalog').textContent = catalogo;
            
            const downloadBtn = document.getElementById('modal-download');
            downloadBtn.href = url;
            downloadBtn.download = `${catalogo}.jpg`;

            document.getElementById('image-modal').classList.remove('hidden');
        }

        window.closeImageModal = function() {
            document.getElementById('image-modal').classList.add('hidden');
        }

        // --- SELECCIÓN MASIVA ---
        window.toggleSelectAll = function() {
            const checkboxes = document.querySelectorAll('.photo-checkbox');
            if (checkboxes.length === 0) return;
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            checkboxes.forEach(cb => cb.checked = !allChecked);
        }

        // --- DESCARGA MASIVA ---
        window.downloadSelected = async function() {
            const checkboxes = document.querySelectorAll('.photo-checkbox:checked');
            if (checkboxes.length === 0) return Swal.fire('Atención', 'Seleccione al menos una foto para descargar.', 'info');

            const zip = new JSZip();
            const folder = zip.folder("fotos_inventario");
            
            Swal.fire({
                title: 'Generando ZIP...',
                html: `Procesando ${checkboxes.length} imágenes.`,
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading() }
            });

            try {
                const promises = Array.from(checkboxes).map(async (cb) => {
                    const url = cb.value;
                    const filename = cb.dataset.filename || `foto_${Date.now()}.jpg`;
                    const response = await fetch(url);
                    const blob = await response.blob();
                    folder.file(filename, blob);
                });

                await Promise.all(promises);
                const content = await zip.generateAsync({type:"blob"});
                saveAs(content, "fotos_inventario.zip");
                Swal.close();
            } catch (e) {
                console.error(e);
                Swal.fire('Error', 'Fallo al generar el archivo ZIP. Verifique su conexión.', 'error');
            }
        }

        // --- 5. BORRAR FOTO ---
        window.deletePhoto = async function(key, storagePath) {
            const result = await Swal.fire({
                title: '¿Eliminar foto?',
                text: "Esta acción no se puede deshacer.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'Sí, borrar',
                cancelButtonText: 'Cancelar'
            });

            if (result.isConfirmed) {
                try {
                    // 1. Borrar de Storage
                    if (storagePath) {
                        const imageRef = sRef(storage, storagePath);
                        await deleteObject(imageRef);
                    }
                    // 2. Borrar de RTDB
                    await remove(ref(rtdb, `galeria/${key}`));
                    
                    Swal.fire('Eliminado', 'La foto ha sido eliminada.', 'success');
                } catch (e) {
                    console.error(e);
                    Swal.fire('Error', 'No se pudo eliminar la foto.', 'error');
                }
            }
        }

        // --- DARK MODE ---
        window.toggleDarkMode = function() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        }
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }

        window.onload = async () => {
            const user = await protegerPagina();
            const sesion = await obtenerSesion(user);
            esAdmin = sesion.admin;
            localStorage.setItem('operario_gram', (sesion.nombre || '').toUpperCase());
            userId = user.uid;
            await initGaleria();
        };
    </script>
</body>
</html>
